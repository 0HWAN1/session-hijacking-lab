# L7 Web Attack Detection Lab - ModSecurity custom rules
#
# 주의:
#  - XSS 페이로드 차단은 OWASP CRS 941xxx 규칙이 담당한다. 여기서 중복 작성하지 않는다.
#  - 커스텀 룰 ID는 100000번대를 사용(CRS의 9xxxxx 대역과 충돌 방지).
#  - 세션 쿠키(PHPSESSID)는 "보호 대상"이지 차단 대상이 아니다.
#    PHPSESSID 존재만으로 deny하면 정상 세션까지 전부 403이 되므로 금지.

# 커스텀: 응답 본문에 document.cookie가 반영되면 경보(차단은 CRS가 요청 단계에서 수행)
SecRule RESPONSE_BODY "@contains document.cookie" \
  "id:100001,phase:4,log,pass,\
   msg:'Stored XSS payload reflected in response body'"

# 참고(세션 하드닝): 쿠키 하드닝은 룰이 아니라 아래로 처리한다.
#  - Nginx:  proxy_cookie_flags ~ httponly samesite=strict;
#  - PHP:    session.cookie_httponly = 1 / session.cookie_samesite = Strict
